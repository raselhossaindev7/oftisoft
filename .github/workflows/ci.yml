name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-oftisoft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Advisory for now (matches the other rhd repos).
      - run: npm run lint
        continue-on-error: true

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          API_BACKEND_URL: https://api.oftisoft.com/api
          NEXT_PUBLIC_SOCKET_URL: https://api.oftisoft.com
          NEXT_PUBLIC_CDN_URL: https://cdn.oftisoft.com
